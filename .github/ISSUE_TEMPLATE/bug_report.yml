name: Bug report
description: Something was detected, compared or updated incorrectly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The `--json` output below is the most useful thing you can share; for "unknown" versions or a slow check, also run `ccl-caut --doctor` and paste its output.
        **Please redact your username** in binary paths (for example `C:\Users\you\...` or `/home/you/...`).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did ccl-caut do instead?
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2 / macOS 15.5 / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal
      placeholder: Windows Terminal / VS Code / iTerm2 / GNOME Terminal / cmd.exe
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`
      placeholder: v22.11.0
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ccl-caut version
      description: Output of `ccl-caut --version`
    validations:
      required: true
  - type: textarea
    id: json
    attributes:
      label: ccl-caut --json output
      description: Run `ccl-caut --json` and paste the output (redact usernames in paths).
      render: json
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: ccl-caut --doctor output
      description: Versions shown as "unknown", or a slow or failing check? Run `ccl-caut --doctor` and paste the output (redact usernames in paths).
      render: text
    validations:
      required: false