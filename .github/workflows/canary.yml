name: Canary

# Catches upstream changes (package renames, new bin names, moved installs) by
# installing the npm- and PyPI-distributed CLIs for real on Linux, macOS and
# Windows and checking that ccl-caut still detects each one with the right
# install method (npm, uv, pipx), a parsed version and a resolved latest version.
# Read-only: it never commits, tags or publishes anything.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  canary:
    name: npm CLIs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # Copilot and Qwen Code need Node 22+; Wrangler and Netlify CLI need 22.13+.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Install the npm-distributed CLIs
        run: |
          failed=()
          for pkg in @anthropic-ai/claude-code @openai/codex @github/copilot opencode-ai @google/gemini-cli @qwen-code/qwen-code firebase-tools wrangler vercel netlify-cli cline @ampcode/cli; do
            echo "::group::npm install -g $pkg"
            npm install -g "$pkg" || failed+=("$pkg")
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::npm install failed on ${{ runner.os }} for: ${failed[*]}"
            exit 1
          fi

      # Copilot auto-updates itself into a cache dir; check whether the binary
      # that runs reports a different version than the npm package (warning only).
      # Linux only: it relies on GNU timeout and find -printf, and the question is
      # the same on every OS.
      - name: Copilot self-update check (informational)
        if: runner.os == 'Linux'
        run: |
          pkg_version="$(node -p "require('$(npm root -g)/@github/copilot/package.json').version")"
          for attempt in 1 2; do
            cli_output="$(timeout 120 copilot --version 2>&1 | head -5 || true)"
            echo "attempt $attempt: npm package $pkg_version | copilot --version: $cli_output"
          done
          if ! printf '%s' "$cli_output" | grep -qF "$pkg_version"; then
            echo "::warning title=Copilot version mismatch::npm package $pkg_version, but copilot --version prints: $cli_output"
          fi
          for dir in "$HOME/.copilot" "$HOME/.cache/copilot" "$HOME/.config/copilot" "$HOME/.local/state/copilot"; do
            if [ -e "$dir" ]; then
              echo "::group::$dir"
              find "$dir" -maxdepth 4 \( -type f -o -type d \) -printf '%y %10s %p\n' | head -80
              echo "::endgroup::"
            else
              echo "$dir: (none)"
            fi
          done

      - name: Check detection
        run: |
          node dist/index.js --json --refresh > scan.json || true
          node scripts/canary-check.mjs scan.json claude codex copilot opencode gemini qwen firebase wrangler vercel netlify cline amp

  # PyPI tools installed with uv (aider-install and the Vibe install script both use uv tool).
  canary-uv:
    name: uv tools (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Aider pins Python 3.12 the way aider-install does; Mistral Vibe 3 needs Python 3.14+
      # (on an older Python the resolver silently installs Vibe 2.x). uv fetches 3.14 itself.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build
      - name: Install uv, then Aider and Mistral Vibe as uv tools
        run: |
          python -m pip install --upgrade uv
          uv --version
          # uv tool shims go to ~/.local/bin (%USERPROFILE%\.local\bin on Windows).
          uv tool dir --bin >> "$GITHUB_PATH"
          uv tool install --python 3.12 aider-chat
          uv tool install --python 3.14 mistral-vibe
          uv tool list
      - name: Check detection
        run: |
          node dist/index.js --json --refresh > scan.json || true
          node scripts/canary-check.mjs scan.json aider=uv vibe=uv

  # The same kind of tool through pipx (separate job: uv and pipx would share ~/.local/bin).
  canary-pipx:
    name: pipx tools (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Mistral Vibe 3 needs Python 3.14+.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: npm ci
      - run: npm run build
      - name: Install Mistral Vibe with pipx
        run: |
          python -m pip install --upgrade pipx
          # Hosted runners may preset PIPX_HOME / PIPX_BIN_DIR; ask pipx where its shims go.
          python -m pipx environment --value PIPX_BIN_DIR >> "$GITHUB_PATH"
          python -m pipx install mistral-vibe
          python -m pipx list
      - name: Check detection
        run: |
          node dist/index.js --json --refresh > scan.json || true
          node scripts/canary-check.mjs scan.json vibe=pipx