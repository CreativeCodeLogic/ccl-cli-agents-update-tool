name: Canary

# Catches upstream changes (package renames, new bin names, moved installs) by
# installing the npm- and PyPI-distributed CLIs for real on Linux, macOS and
# Windows and checking that ccl-caut still detects each one with the right
# install method (npm, uv, pipx), a parsed version and a resolved latest version.
# Read-only: it never commits, tags or publishes anything.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Run one job group only (npm, npm12, uv, pipx, python-compat, winget); empty = all"
        required: false
        default: ""
      npm12_caut:
        description: "npm12 job: the ccl-caut to test: 'build' (this checkout) or a published version, e.g. 1.2.0-beta.3"
        required: false
        default: "build"
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  canary:
    if: ${{ !inputs.only || inputs.only == 'npm' }}
    name: npm CLIs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # Copilot and Qwen Code need Node 22+; Wrangler and Netlify CLI need 22.13+.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Install the npm-distributed CLIs
        run: |
          failed=()
          for pkg in @anthropic-ai/claude-code @openai/codex @github/copilot opencode-ai @google/gemini-cli @qwen-code/qwen-code firebase-tools wrangler vercel netlify-cli cline @ampcode/cli; do
            echo "::group::npm install -g $pkg"
            npm install -g "$pkg" || failed+=("$pkg")
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::npm install failed on ${{ runner.os }} for: ${failed[*]}"
            exit 1
          fi

      # Copilot auto-updates itself into a cache dir; check whether the binary
      # that runs reports a different version than the npm package (warning only).
      # Linux only: it relies on GNU timeout and find -printf, and the question is
      # the same on every OS.
      - name: Copilot self-update check (informational)
        if: runner.os == 'Linux'
        run: |
          pkg_version="$(node -p "require('$(npm root -g)/@github/copilot/package.json').version")"
          for attempt in 1 2; do
            cli_output="$(timeout 120 copilot --version 2>&1 | head -5 || true)"
            echo "attempt $attempt: npm package $pkg_version | copilot --version: $cli_output"
          done
          if ! printf '%s' "$cli_output" | grep -qF "$pkg_version"; then
            echo "::warning title=Copilot version mismatch::npm package $pkg_version, but copilot --version prints: $cli_output"
          fi
          for dir in "$HOME/.copilot" "$HOME/.cache/copilot" "$HOME/.config/copilot" "$HOME/.local/state/copilot"; do
            if [ -e "$dir" ]; then
              echo "::group::$dir"
              find "$dir" -maxdepth 4 \( -type f -o -type d \) -printf '%y %10s %p\n' | head -80
              echo "::endgroup::"
            else
              echo "$dir: (none)"
            fi
          done

      - name: Check detection
        run: |
          node dist/index.js --json --refresh > scan.json || true
          node scripts/canary-check.mjs scan.json claude codex copilot opencode gemini qwen firebase wrangler vercel netlify cline amp

  # npm 12 blocks install scripts by default, also for `npm install -g`, and still exits 0.
  # Some CLIs ship a placeholder binary that their own install script replaces
  # (Claude Code, Amp, OpenCode): updating them without --allow-scripts leaves a
  # command that doesn't start. This job updates every npm CLI with ccl-caut --yes
  # on the latest npm and checks that each one is on the latest version AND runs.
  canary-npm12:
    if: ${{ !inputs.only || inputs.only == 'npm12' }}
    name: npm 12 updates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      TOOLS: "claude codex copilot opencode gemini qwen kimi cline amp firebase wrangler vercel netlify"
      PKGS: "@anthropic-ai/claude-code @openai/codex @github/copilot opencode-ai @google/gemini-cli @qwen-code/qwen-code @moonshot-ai/kimi-code cline @ampcode/cli firebase-tools wrangler vercel netlify-cli"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Upgrade npm to the latest
        run: |
          npm install -g npm@latest
          echo "npm $(npm -v)"
          major="$(npm -v | cut -d. -f1)"
          if [ "$major" -lt 12 ]; then echo "::error::expected npm 12 or later, got $(npm -v)"; exit 1; fi

      # One version back, with every install script allowed (a working starting point,
      # independent of what ccl-caut knows), so ccl-caut has an update to make.
      - name: Install the previous version of each npm CLI
        run: |
          for pkg in $PKGS; do
            latest="$(npm view "$pkg" dist-tags.latest)"
            # The release before latest, of the same kind (no alpha/beta in between; Amp's versions all carry a suffix).
            prev="$(npm view "$pkg" versions --json | node -e 'const v=JSON.parse(require("fs").readFileSync(0,"utf8"));const l=process.argv[1];const same=l.includes("-")?v:v.filter((x)=>!x.includes("-"));const i=same.lastIndexOf(l);if(i<1){console.error("no version before "+l);process.exit(1)}console.log(same[i-1])' "$latest")"
            echo "::group::$pkg@$prev"
            npm install -g --dangerously-allow-all-scripts "$pkg@$prev"
            echo "::endgroup::"
          done

      - name: ccl-caut --yes updates them (every other tool skipped)
        env:
          CI: ""
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.npm12_caut || 'build' }}" = build ]; then caut="node dist/index.js"; else npm install -g "ccl-caut@${{ inputs.npm12_caut }}"; caut="ccl-caut"; fi
          echo "testing: $($caut --version)"
          cfg="$RUNNER_TEMP/cfg"; mkdir -p "$cfg/ccl-caut"
          if [ "$RUNNER_OS" = Windows ]; then export APPDATA="$(cygpath -w "$cfg")"; else export XDG_CONFIG_HOME="$cfg"; fi
          $caut --json --refresh > before.json || true
          node -e 'const s=require("./before.json");const keep=process.argv[2].split(" ");const tools={};for(const t of s.tools)tools[t.id]=keep.includes(t.id)?"update":"skip";tools["ccl-caut"]="skip";require("fs").writeFileSync(process.argv[1],JSON.stringify({schema:1,tools}))' "$cfg/ccl-caut/config.json" "$TOOLS"
          set +e; $caut --yes > yes.log 2>&1; code=$?; set -e
          cat yes.log; echo "--yes exit code: $code"
          $caut --json --refresh > after.json || true
          node scripts/canary-npm12.mjs after.json yes.log $TOOLS

  # PyPI tools installed with uv (aider-install and the Vibe install script both use uv tool).
  canary-uv:
    if: ${{ !inputs.only || inputs.only == 'uv' }}
    name: uv tools (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Aider pins Python 3.12 the way aider-install does; Mistral Vibe 3 needs Python 3.14+
      # (on an older Python the resolver silently installs Vibe 2.x). uv fetches 3.14 itself.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build
      - name: Install uv, then Aider and Mistral Vibe as uv tools
        run: |
          python -m pip install --upgrade uv
          uv --version
          # uv tool shims go to ~/.local/bin (%USERPROFILE%\.local\bin on Windows).
          uv tool dir --bin >> "$GITHUB_PATH"
          uv tool install --python 3.12 aider-chat
          uv tool install --python 3.14 mistral-vibe
          uv tool list
      - name: Check detection
        run: |
          node dist/index.js --json --refresh > scan.json || true
          node scripts/canary-check.mjs scan.json aider=uv vibe=uv

  # The same kind of tool through pipx (separate job: uv and pipx would share ~/.local/bin).
  canary-pipx:
    if: ${{ !inputs.only || inputs.only == 'pipx' }}
    name: pipx tools (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Mistral Vibe 3 needs Python 3.14+.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: npm ci
      - run: npm run build
      - name: Install Mistral Vibe with pipx
        run: |
          python -m pip install --upgrade pipx
          # Hosted runners may preset PIPX_HOME / PIPX_BIN_DIR; ask pipx where its shims go.
          python -m pipx environment --value PIPX_BIN_DIR >> "$GITHUB_PATH"
          python -m pipx install mistral-vibe
          python -m pipx list
      - name: Check detection
        run: |
          node dist/index.js --json --refresh > scan.json || true
          node scripts/canary-check.mjs scan.json vibe=pipx

  # A tool installed on a Python its latest release doesn't support (Mistral Vibe 3
  # needs 3.14+; installed on 3.12 it stays on 2.x): ccl-caut must plan the manual
  # reinstall with the documented command, and running that command must bring it
  # up to date.
  canary-python-compat:
    if: ${{ !inputs.only || inputs.only == 'python-compat' }}
    name: Python compatibility (${{ matrix.manager }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        manager: [uv, pipx]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # 3.12 for the old install; 3.14 must be available for `pipx reinstall --python 3.14`.
      - uses: actions/setup-python@v7
        with:
          python-version: |
            3.14
            3.12
      - run: npm ci
      - run: npm run build
      - name: Install Mistral Vibe on Python 3.12 (${{ matrix.manager }})
        run: |
          if [ "${{ matrix.manager }}" = uv ]; then
            python -m pip install --upgrade uv
            uv tool dir --bin >> "$GITHUB_PATH"
            uv tool install --python 3.12 mistral-vibe
            cat "$(uv tool dir)/mistral-vibe/pyvenv.cfg"
          else
            python -m pip install --upgrade pipx
            python -m pipx environment --value PIPX_BIN_DIR >> "$GITHUB_PATH"
            python -m pipx install --python 3.12 mistral-vibe
            cat "$(python -m pipx environment --value PIPX_LOCAL_VENVS)/mistral-vibe/pyvenv.cfg"
          fi
      - name: ccl-caut plans the reinstall, and the planned command works
        run: |
          node dist/index.js --json --refresh > before.json || true
          cmd="$(node scripts/canary-compat.mjs before.json vibe plan)"
          # Empty: the latest release supports this Python (checked: up to date, no note).
          if [ -z "$cmd" ]; then exit 0; fi
          echo "planned: $cmd"
          # pipx may only be reachable as a module on some runners.
          if [ "${{ matrix.manager }}" = pipx ] && ! command -v pipx >/dev/null; then cmd="python -m $cmd"; fi
          eval "$cmd"
          node dist/index.js --json --refresh > after.json || true
          node scripts/canary-compat.mjs after.json vibe up-to-date

  # winget (Windows): a per-user install of the previous version must get the
  # right plan: automatic for allowlisted tools when winget has the latest
  # version (then `ccl-caut --yes` must upgrade it, verified by a rescan),
  # "waiting for winget" when winget is behind the vendor (then --yes must not
  # try), a command to copy for tools not on the allowlist.
  canary-winget:
    if: ${{ !inputs.only || inputs.only == 'winget' }}
    name: winget ${{ matrix.pkg.tool }} (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - { id: SST.opencode, tool: opencode, bin: opencode, expect: "auto waiting" }
          - { id: Google.AntigravityCLI, tool: antigravity, bin: agy, expect: "auto waiting" }
          - { id: GitHub.cli, tool: gh, bin: gh, expect: "auto waiting" }
          - { id: GitHub.Copilot, tool: copilot, bin: copilot, expect: "manual" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install the previous winget version per-user
        run: |
          id="${{ matrix.pkg.id }}"
          winget --version
          # The image's machine-wide GitHub CLI would shadow the per-user copy.
          if [ "$id" = "GitHub.cli" ]; then winget uninstall --id GitHub.cli --exact --silent --accept-source-agreements --disable-interactivity || true; fi
          older="$(winget show --id "$id" --exact --source winget --versions --accept-source-agreements --disable-interactivity | tr -d '\r' | grep -E '^\s*v?[0-9]+(\.[0-9]+)+\S*\s*$' | sed -n 2p | tr -d ' ')"
          echo "installing $id $older"
          winget install --id "$id" --exact --source winget --version "$older" --scope user --silent --accept-source-agreements --accept-package-agreements --disable-interactivity
          # GITHUB_PATH takes Windows paths on Windows runners.
          cygpath -w "$LOCALAPPDATA/Microsoft/WinGet/Links" >> "$GITHUB_PATH"
      - name: ccl-caut plans it, and --yes does what the plan says
        env:
          CI: ""
          # GitHub CLI's latest version and the winget repository listing come from the
          # GitHub API; the runner's shared IP hits the unauthenticated limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tool="${{ matrix.pkg.tool }}"
          node dist/index.js --json --refresh > before.json || true
          kind="$(node scripts/canary-winget.mjs before.json "$tool" plan)"
          echo "plan: $kind (allowed: ${{ matrix.pkg.expect }})"
          case " ${{ matrix.pkg.expect }} " in *" $kind "*) ;; *) echo "::error::unexpected plan $kind"; exit 1 ;; esac
          before="$(node -p 'require("./before.json").tools.find((t) => t.id === process.argv[1]).installedVersion' "$tool")"
          # Only this tool may be updated: every other one is "skip" in a temporary config.
          export npm_config_prefix="$(npm prefix -g)"
          export APPDATA="$(cygpath -w "$RUNNER_TEMP/cfg")"
          mkdir -p "$RUNNER_TEMP/cfg/ccl-caut"
          node -e 'const s=require("./before.json");const tools={};for(const t of s.tools)if(t.id!==process.argv[2])tools[t.id]="skip";require("fs").writeFileSync(process.argv[1],JSON.stringify({schema:1,tools}))' "$RUNNER_TEMP/cfg/ccl-caut/config.json" "$tool"
          set +e; node dist/index.js --yes > yes.log 2>&1; code=$?; set -e
          cat yes.log; echo "--yes exit code: $code"
          node dist/index.js --json --refresh > after.json || true
          if [ "$kind" = auto ]; then
            node scripts/canary-winget.mjs after.json "$tool" upgraded "$before"
          else
            if grep -q "Updating " yes.log; then echo "::error::--yes tried to update a $kind plan"; exit 1; fi
            echo "--yes left it alone ($kind), as it should"
          fi