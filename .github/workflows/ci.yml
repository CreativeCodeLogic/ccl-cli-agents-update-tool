name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # While the repo is private, Actions minutes are billed (macOS/Windows at a
        # multiple), so push/PR runs Node 22 only and the full Node matrix is manual.
        # When the repo goes public, enable the full matrix on push/PR (public repos
        # get free hosted-runner minutes): replace this expression with [20, 22, 24].
        node: ${{ github.event_name == 'workflow_dispatch' && fromJSON('[20, 22, 24]') || fromJSON('[22]') }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # Real detection on the runner: hosted images ship some of these CLIs
      # (e.g. npm everywhere, gcloud on Ubuntu). Exit 0 = all current,
      # 1 = updates available; anything else is a failure.
      - name: Smoke test (--check --json)
        shell: bash
        run: |
          set +e
          node dist/index.js --check --json > scan.json
          code=$?
          set -e
          echo "exit code: $code"
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
            echo "::error::unexpected exit code $code"
            exit 1
          fi
          node -e '
            const report = JSON.parse(require("fs").readFileSync("scan.json", "utf8"));
            if (report.tool !== "ccl-caut" || !Array.isArray(report.tools)) {
              console.error("unexpected JSON shape");
              process.exit(1);
            }
            console.table(report.tools.map((t) => ({
              tool: t.id, via: t.installMethod, installed: t.installedVersion,
              latest: t.latestVersion, state: t.state, hidden: t.shadowed.length,
            })));
            for (const t of report.tools.filter((t) => t.installed)) {
              console.log(`${t.id}: ${t.binaryPath} (${t.installMethod})`);
              for (const s of t.shadowed) console.log(`  hidden: ${s.path} (${s.installMethod} ${s.version ?? "?"})`);
            }
          '