name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per event and ref: a newer push to the same branch or PR cancels the older run.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Building and developing needs Node 22.18+ (tsup 9, vitest 5); ccl-caut itself runs
# on Node 20+. Each job builds and packs with a supported toolchain (Node 22 for the
# Node 20 jobs, the job's own Node otherwise), then installs the packed tarball
# globally and smoke-tests it on the job's Node version: the bundle users get.
jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v7

      - name: Set up the build toolchain (Node ${{ matrix.node == 20 && 22 || matrix.node }})
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node == 20 && 22 || matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      # vitest 5 needs Node 22.12+, so the unit tests run in the Node 22 and 24 jobs;
      # the Node 20 jobs test the built package instead.
      - name: Unit tests
        if: matrix.node != 20
        run: npm test

      - name: Pack
        shell: bash
        run: |
          npm pack
          node -e 'const c=require("crypto"),f=require("fs");console.log("dist/index.js sha256", c.createHash("sha256").update(f.readFileSync("dist/index.js")).digest("hex"))'

      # For the self-update test at the end: the same code as 1.1.0-selftest.0,
      # which semver ranks below every published release.
      - name: Pack a self-test build (1.1.0-selftest.0)
        shell: bash
        run: |
          npm version 1.1.0-selftest.0 --no-git-tag-version
          npm run build
          mkdir -p selftest && npm pack --ignore-scripts --pack-destination selftest
          git checkout -- package.json package-lock.json
          npm run build

      - name: Switch to the runtime (Node ${{ matrix.node }})
        if: matrix.node == 20
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install the packed tarball globally
        shell: bash
        run: |
          node --version
          npm install -g ./ccl-caut-*.tgz
          expected="$(node -p 'require("./package.json").version')"
          actual="$(ccl-caut --version)"
          echo "ccl-caut --version: $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::ccl-caut --version printed '$actual', expected '$expected'"
            exit 1
          fi

      # Real detection on the runner: hosted images ship some of these CLIs
      # (e.g. npm everywhere, gcloud on Ubuntu). Exit 0 = all current,
      # 1 = updates available; anything else is a failure.
      - name: Smoke test (--check, --json)
        shell: bash
        run: |
          set +e
          ccl-caut --check > check.txt
          code=$?
          set -e
          cat check.txt
          echo "--check exit code: $code"
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
            echo "::error::unexpected --check exit code $code"
            exit 1
          fi
          ccl-caut --json > scan.json
          node -e '
            const report = JSON.parse(require("fs").readFileSync("scan.json", "utf8"));
            if (report.tool !== "ccl-caut" || !Array.isArray(report.tools)) {
              console.error("unexpected JSON shape");
              process.exit(1);
            }
            console.table(report.tools.map((t) => ({
              tool: t.id, via: t.installMethod, installed: t.installedVersion,
              latest: t.latestVersion, state: t.state, hidden: t.shadowed.length,
            })));
            for (const t of report.tools.filter((t) => t.installed)) {
              console.log(`${t.id}: ${t.binaryPath} (${t.installMethod})`);
              for (const s of t.shadowed) console.log(`  hidden: ${s.path} (${s.installMethod} ${s.version ?? "?"})`);
            }
          '

      # docs/scheduling.md, run as documented against the packed install.
      # cron: the documented job line with cron's empty environment (PATH=/usr/bin:/bin),
      # then with the documented PATH line.
      - name: Scheduling recipe (cron, minimal environment)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$HOME/.local/state/ccl-caut"
          cmd="$(node scripts/scheduling-recipe.mjs cron-command)"
          echo "$cmd"
          cd "$HOME"
          env -i HOME="$HOME" PATH=/usr/bin:/bin sh -c "$cmd"
          env -i HOME="$HOME" PATH="$(node "$GITHUB_WORKSPACE/scripts/scheduling-recipe.mjs" cron-path)" sh -c "$cmd"
          cat "$HOME/.local/state/ccl-caut/ccl-caut.log"
          node "$GITHUB_WORKSPACE/scripts/scheduling-recipe.mjs" check-log "$HOME/.local/state/ccl-caut/ccl-caut.log" 2

      # launchd: lint the documented plist, then run its command the way launchd does
      # (its PATH only, in the WorkingDirectory, output appended to the log).
      - name: Scheduling recipe (launchd plist)
        if: runner.os == 'macOS'
        run: |
          node scripts/scheduling-recipe.mjs plist > ccl-caut.plist
          plutil -lint ccl-caut.plist
          mkdir -p "$HOME/Library/Logs"
          cmd="$(node scripts/scheduling-recipe.mjs plist-command)"
          path_value="$(node scripts/scheduling-recipe.mjs plist-path)"
          echo "$cmd"
          (cd "$HOME" && env -i HOME="$HOME" PATH="$path_value" /bin/sh -c "$cmd" >> "$HOME/Library/Logs/ccl-caut.log" 2>&1)
          cat "$HOME/Library/Logs/ccl-caut.log"
          node scripts/scheduling-recipe.mjs check-log "$HOME/Library/Logs/ccl-caut.log" 1

      # Self-update, end to end: a global 1.1.0-selftest.0 updates itself with
      # `ccl-caut --yes` to the newest published version of its channel (a
      # prerelease is offered the higher of `latest` and `next`). Every other tool
      # is set to "skip" in a temporary config, so nothing else on the runner
      # changes. Runs last: afterwards the global install is the published version.
      - name: Self-update end to end
        shell: bash
        env:
          CI: ""
        run: |
          npm install -g ./selftest/ccl-caut-1.1.0-selftest.0.tgz
          test "$(ccl-caut --version)" = "1.1.0-selftest.0"
          expected="$(npm view ccl-caut dist-tags --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const t=JSON.parse(s),semver=require("semver");console.log([t.latest,t.next].filter(Boolean).sort(semver.rcompare)[0])})')"
          echo "expected after the self-update: $expected"
          # A temporary config folder (the npm prefix stays where it is).
          export npm_config_prefix="$(npm prefix -g)"
          cfg="$RUNNER_TEMP/ccl-caut-config"
          if [ "$RUNNER_OS" = "Windows" ]; then export APPDATA="$(cygpath -w "$cfg")"; else export XDG_CONFIG_HOME="$cfg"; fi
          mkdir -p "$cfg/ccl-caut"
          ccl-caut --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const tools={};for(const t of JSON.parse(s).tools)tools[t.id]="skip";require("fs").writeFileSync(process.argv[1],JSON.stringify({schema:1,tools}))})' "$cfg/ccl-caut/config.json"
          set +e
          if [ "$RUNNER_OS" = "Windows" ]; then cmd //c "ccl-caut --yes" > selfupdate.log 2>&1; else ccl-caut --yes > selfupdate.log 2>&1; fi
          code=$?
          set -e
          cat selfupdate.log
          echo "exit code: $code"
          grep -q "CCL CAUT updated to $expected" selfupdate.log || { echo "::error::no 'CCL CAUT updated to $expected' line"; exit 1; }
          installed="$(node -p 'require(process.argv[1]+"/ccl-caut/package.json").version' "$(npm root -g)")"
          test "$installed" = "$expected" || { echo "::error::global install is $installed, expected $expected"; exit 1; }
          test "$(ccl-caut --version)" = "$expected" || { echo "::error::ccl-caut --version: $(ccl-caut --version), expected $expected"; exit 1; }
          echo "self-update OK: 1.1.0-selftest.0 -> $expected"