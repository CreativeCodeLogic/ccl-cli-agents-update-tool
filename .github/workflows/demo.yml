name: Demo GIF

# Manual only: renders docs/demo.tape with VHS against fixture data (--demo)
# and uploads docs/demo.gif as an artifact. Nothing is committed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: charmbracelet/vhs-action@v2
        with:
          path: docs/demo.tape

      - uses: actions/upload-artifact@v7
        with:
          name: demo-gif
          path: docs/demo.gif
          if-no-files-found: error