name: Release

# One workflow for every version tag; scripts/release-channel.mjs decides what it may do:
#   vX.Y.Z-rc.N     -> GitHub pre-release with the npm tarball attached. NEVER publishes to npm.
#   vX.Y.Z          -> npm publish (latest) + GitHub Release.
#   vX.Y.Z-<other>  -> npm publish (next) + GitHub pre-release.
# A version that is already on npm is skipped (the GitHub Release is still created).
# If the repository were ever private again, stable and beta tags would skip npm too.
# Setup (npm trusted publisher): see RELEASING.md.
on:
  push:
    tags: ["v*.*.*"]

# Least privilege: nothing by default; only the release job may write.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v7

      # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Classify the tag
        id: channel
        run: node scripts/release-channel.mjs "$GITHUB_REF_NAME" --private "${{ github.event.repository.private }}" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Verify the tag matches package.json
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ "${{ steps.channel.outputs.version }}" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: node scripts/changelog-section.mjs "${{ steps.channel.outputs.version }}" > release-notes.md

      # ---- Release candidates: GitHub pre-release only ----
      - name: Pack the release candidate
        if: steps.channel.outputs.channel == 'rc'
        run: npm pack

      - name: Create the GitHub pre-release (rc)
        if: steps.channel.outputs.channel == 'rc'
        run: |
          gh release create "$GITHUB_REF_NAME" ccl-caut-*.tgz --verify-tag --prerelease \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}

      # ---- npm releases (stable and beta) ----
      - name: Skip npm while the repository is private
        if: steps.channel.outputs.npm_skipped == 'private'
        run: |
          echo "::notice::npm publish skipped: repo is private; publish manually (see RELEASING.md)."

      - run: npm install -g npm@latest && npm --version
        if: steps.channel.outputs.publish_to_npm == 'true'

      # Trusted publishing (OIDC) is used when configured on npmjs.com; NPM_TOKEN is
      # only a fallback (see RELEASING.md). Skipped when the version is already on npm.
      - name: Publish to npm
        if: steps.channel.outputs.publish_to_npm == 'true' && steps.channel.outputs.channel != 'rc'
        run: |
          version="${{ steps.channel.outputs.version }}"
          name="$(node -p "require('./package.json').name")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; skipping publish"
            exit 0
          fi
          if [ "${{ steps.channel.outputs.channel }}" = "stable" ]; then dist_tag=latest; else dist_tag=next; fi
          npm publish --access public --provenance --tag "$dist_tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub Release
        if: steps.channel.outputs.channel != 'rc'
        run: |
          prerelease=""
          if [ "${{ steps.channel.outputs.channel }}" != "stable" ]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md $prerelease
        env:
          GH_TOKEN: ${{ github.token }}