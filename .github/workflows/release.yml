name: Release

# One workflow for every version tag; scripts/release-channel.mjs decides what it may do:
#   vX.Y.Z-rc.N     -> GitHub pre-release with the npm tarball attached. NEVER goes to npm.
#   vX.Y.Z          -> npm STAGED publish (latest) + GitHub Release.
#   vX.Y.Z-<other>  -> npm STAGED publish (next) + GitHub pre-release.
# Staged publishing (`npm stage publish`, through trusted publishing/OIDC, with provenance):
# the version waits on npmjs.com until a maintainer approves it with 2FA (RELEASING.md).
# A version that is already on npm is skipped (the GitHub Release is still created).
# If the repository were ever private again, stable and beta tags would skip npm too.
# Setup (npm trusted publisher): see RELEASING.md.
on:
  push:
    tags: ["v*.*.*"]

# Least privilege: nothing by default; only the release job may write.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v7

      # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Classify the tag
        id: channel
        run: node scripts/release-channel.mjs "$GITHUB_REF_NAME" --private "${{ github.event.repository.private }}" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Verify the tag matches package.json
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ "${{ steps.channel.outputs.version }}" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: node scripts/changelog-section.mjs "${{ steps.channel.outputs.version }}" > release-notes.md

      # ---- Release candidates: GitHub pre-release only ----
      - name: Pack the release candidate
        if: steps.channel.outputs.channel == 'rc'
        run: npm pack

      - name: Create the GitHub pre-release (rc)
        if: steps.channel.outputs.channel == 'rc'
        run: |
          gh release create "$GITHUB_REF_NAME" ccl-caut-*.tgz --verify-tag --prerelease \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}

      # ---- npm releases (stable and beta) ----
      - name: Skip npm while the repository is private
        if: steps.channel.outputs.npm_skipped == 'private'
        run: |
          echo "::notice::npm publish skipped: repo is private; publish manually (see RELEASING.md)."

      - run: npm install -g npm@latest && npm --version
        if: steps.channel.outputs.publish_to_npm == 'true'

      # Staged publish through trusted publishing (OIDC): no npm token anywhere; the
      # trusted publisher on npmjs.com allows only `npm stage publish`. The dist-tag is
      # fixed at staging (beta -> next, stable -> latest). Skipped when the version is
      # already published.
      - name: Stage the npm release
        id: stage
        if: steps.channel.outputs.publish_to_npm == 'true' && steps.channel.outputs.channel != 'rc'
        run: |
          set -o pipefail # a failed stage must fail the job, even though its output goes through tee
          version="${{ steps.channel.outputs.version }}"
          name="$(node -p "require('./package.json').name")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; skipping"
            echo "staged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ steps.channel.outputs.channel }}" = "stable" ]; then dist_tag=latest; else dist_tag=next; fi
          npm stage publish --provenance --tag "$dist_tag" 2>&1 | tee stage-output.txt
          echo "staged=true" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          {
            echo "### npm: $name@$version staged (dist-tag \`$dist_tag\`)"
            echo ""
            echo "A maintainer must approve it with 2FA before it is published:"
            echo "npmjs.com -> $name -> **Staged Packages** tab -> **Approve** (or \`npm stage approve <stage-id>\`)."
            echo ""
            echo '```'
            cat stage-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create the GitHub Release
        if: steps.channel.outputs.channel != 'rc'
        run: |
          prerelease=""
          if [ "${{ steps.channel.outputs.channel }}" != "stable" ]; then prerelease="--prerelease"; fi
          if [ "${{ steps.stage.outputs.staged }}" = "true" ]; then
            # Staged, not yet live on npm: say so until a maintainer approves (RELEASING.md).
            { echo "> **npm:** this version is staged and awaits maintainer approval; it becomes installable (\`ccl-caut@${{ steps.stage.outputs.dist_tag }}\`) once approved."; echo; cat release-notes.md; } > release-body.md
          else
            cp release-notes.md release-body.md
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-body.md $prerelease
        env:
          GH_TOKEN: ${{ github.token }}